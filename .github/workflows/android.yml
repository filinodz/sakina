name: Android TV — APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      # Two names: a versioned one, and a stable one so that
      # /releases/latest/download/sakina-android-tv.apk always points to the newest APK.
      - run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sakina-${{ github.ref_name }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk sakina-android-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sakina-apk
          path: sakina-*.apk
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sakina-*.apk
          name: Sakina ${{ github.ref_name }}
          body_path: .github/release-notes.md
